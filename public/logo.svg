<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="pitchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Pitch Ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#pitchGrad)" stroke-width="8" stroke-dasharray="16 6"/>
  
  <!-- Ball Base Circle -->
  <circle cx="100" cy="100" r="82" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- Ball Pattern Facets / Pitch Lines -->
  <!-- Central Pentagon -->
  <polygon points="100,68 126,86 116,118 84,118 74,86" fill="url(#pitchGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Seam Lines radiating outwards -->
  <line x1="100" y1="68" x2="100" y2="35" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="126" y1="86" x2="158" y2="76" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="116" y1="118" x2="142" y2="148" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="84" y1="118" x2="58" y2="148" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="74" y1="86" x2="42" y2="76" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Corner Patch Polygons -->
  <polygon points="85,24 115,24 100,35" fill="url(#pitchGrad)" opacity="0.85"/>
  <polygon points="166,62 178,92 158,76" fill="url(#pitchGrad)" opacity="0.85"/>
  <polygon points="152,160 128,172 142,148" fill="url(#pitchGrad)" opacity="0.85"/>
  <polygon points="48,160 72,172 58,148" fill="url(#pitchGrad)" opacity="0.85"/>
  <polygon points="34,62 22,92 42,76" fill="url(#pitchGrad)" opacity="0.85"/>

  <!-- Glowing Emblem Center "+" (Plus) in Gold -->
  <g filter="url(#glow)">
    <!-- Plus Horizontal -->
    <rect x="84" y="93" width="32" height="14" rx="4" fill="url(#goldGrad)" stroke="#78350f" stroke-width="0.8"/>
    <!-- Plus Vertical -->
    <rect x="93" y="84" width="14" height="32" rx="4" fill="url(#goldGrad)" stroke="#78350f" stroke-width="0.8"/>
    <!-- Central Jewel/Star highlight -->
    <circle cx="100" cy="100" r="3" fill="#ffffff"/>
  </g>

  <!-- Decorative Orbit Dots -->
  <circle cx="28" cy="100" r="4" fill="url(#goldGrad)"/>
  <circle cx="172" cy="100" r="4" fill="url(#goldGrad)"/>
  <circle cx="100" cy="28" r="4" fill="url(#pitchGrad)"/>
  <circle cx="100" cy="172" r="4" fill="url(#pitchGrad)"/>
</svg>

